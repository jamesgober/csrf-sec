# Comparison benchmarks against other Rust CSRF crates. Development only: this
# package is not part of the published crate, is never a dependency of it, and
# its third-party crates never reach csrf-sec users.
[package]
name = "csrf-sec-bench-compare"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]

[dev-dependencies]
csrf-sec = { path = "../.." }
csrf = "=0.5.0"
data-encoding = "2"
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "compare"
harness = false

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
