# =============================================================================
#  R E P S   ·   csrf-sec
# =============================================================================
[package]
name    = "csrf-sec"
version = "0.2.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "Request-forgery protection for Rust services: signed, session-bound tokens masked per response, plus Fetch Metadata and Origin policy. Stateless, protocol-free, no allocation on verify."

# Keywords (5 max)
keywords = ["security", "csrf", "web", "token", "anti-forgery"]

# Categories
categories = ["web-programming", "cryptography", "authentication"]

# Links
homepage      = "https://github.com/jamesgober/csrf-sec"
repository    = "https://github.com/jamesgober/csrf-sec"
documentation = "https://docs.rs/csrf-sec"

# Authors
authors = ["James Gober <me@jamesgober.com>"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "csrf_sec"
path = "src/lib.rs"


# FEATURE FLAGS
# #################################
[features]
default = []


# DEPENDENCIES
# #################################
[dependencies]
# None yet. Planned dependencies and the reason for each are listed in
# dev/PLAN.md; each is added with the first code that needs it.


# DEV DEPENDENCIES
# #################################
[dev-dependencies]


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
