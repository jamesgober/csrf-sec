# =============================================================================
#  R E P S   ·   csrf-sec
# =============================================================================
[package]
name    = "csrf-sec"
version = "1.0.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "Request-forgery protection for Rust services: signed, session-bound tokens masked per response, plus Fetch Metadata and Origin policy. Stateless, protocol-free, no allocation on verify."

# Keywords (5 max)
keywords = ["security", "csrf", "web", "token", "anti-forgery"]

# Categories
categories = ["web-programming", "cryptography", "authentication"]

# Links
homepage      = "https://github.com/jamesgober/csrf-sec"
repository    = "https://github.com/jamesgober/csrf-sec"
documentation = "https://docs.rs/csrf-sec"

# Authors
authors = ["James Gober <me@jamesgober.com>"]

# Development-only packages and tool configuration are never published.
exclude = ["/dev/bench-compare", "/fuzz", "/.cargo"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "csrf_sec"
path = "src/lib.rs"


# FEATURE FLAGS
# #################################
[features]
default = ["std"]

# System clock, the OS-backed pad source, and the Tier 1 and Tier 2 calls.
std = ["alloc", "crypt-io/std", "dep:mod-rand"]

# `From<Token> for String`. The core always links `alloc` (crypt-io needs it);
# this flag only gates conveniences that hand out owned strings.
alloc = []


# DEPENDENCIES
# #################################
[dependencies]
# Keyed BLAKE3, constant-time tag comparison, and Zeroizing. The accepted
# audited-crypto exception (dev/PLAN.md, section 12).
crypt-io = { version = "1.1", default-features = false, features = ["mac-blake3", "zeroize"] }

# OS CSPRNG for token pads and nonces (first-party, zero dependencies).
mod-rand = { version = "1", optional = true, default-features = false, features = ["tier3"] }


# DEV DEPENDENCIES
# #################################
[dev-dependencies]
# Benchmarks only; never linked into the library.
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
# Property tests only; never linked into the library.
proptest = { version = "1.6", default-features = false, features = ["std"] }


# EXAMPLES
# #################################
[[example]]
name = "basic"
required-features = ["std"]

[[example]]
name = "rotation"
required-features = ["std"]

[[example]]
name = "tier3"

[[example]]
name = "server"
required-features = ["std"]


# BENCHMARKS
# #################################
[[bench]]
name = "csrf"
harness = false
required-features = ["std"]


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
