name: Mutants

# The full mutation run: every mutant of the crate must be caught by a test
# (proven equivalent mutants are excluded in .cargo/mutants.toml). Pull
# requests run the changed code only, in ci.yml.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  mutants:
    name: Mutants (full)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: Mutants
        run: cargo mutants --no-shuffle -j 2 -- --lib --tests
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants.out
          path: mutants.out
