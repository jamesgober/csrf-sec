name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Run every JS action on Node.js 24 ahead of GitHub's forced migration,
  # silencing "Node.js 20 actions are deprecated" runner warnings.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Test (${{ matrix.os }} / ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, "1.85"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (default features)
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Clippy (no default features)
        run: cargo clippy --all-targets --no-default-features -- -D warnings
      - name: Test (default features)
        run: cargo test
      - name: Test (all features)
        run: cargo test --all-features
      # Doctests show the default (std) API, so the no_std run covers the
      # library and integration tests only.
      - name: Test (no default features)
        run: cargo test --no-default-features --lib --tests
      - name: Build examples
        run: cargo build --examples
      - name: Doc (all features)
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  no_std:
    name: no_std (bare metal, ${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, "1.85"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          targets: thumbv7em-none-eabi
      - uses: Swatinem/rust-cache@v2
      # A target with no standard library at all: proves the core is no_std.
      - name: Build (no default features)
        run: cargo build --no-default-features --target thumbv7em-none-eabi
      - name: Build (alloc)
        run: cargo build --no-default-features --features alloc --target thumbv7em-none-eabi

  timing:
    name: Timing (constant-time smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # dudect-style Welch t-tests on the tag comparison and the codec, plus a
      # control that must detect a real difference. Shared runners are noisy,
      # so CI uses the "definite leak" threshold (|t| < 10); releases are
      # checked locally at |t| < 4.5 with 2,000,000 samples per class.
      - name: Timing tests
        run: cargo test --release --test timing -- --ignored --nocapture --test-threads 1
        env:
          CSRF_TIMING_SAMPLES: "200000"
          CSRF_TIMING_T: "10"

  fuzz:
    name: Fuzz (smoke)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # The prebuilt cargo-fuzz binary is statically linked (musl) and would
      # default to the musl target, which the sanitizer does not support.
      - name: Build fuzz targets
        run: cargo fuzz build -O --target x86_64-unknown-linux-gnu
        working-directory: fuzz
      - name: Run each target for 30 seconds
        working-directory: fuzz
        run: |
          for target in verify mutate policy once; do
            cargo fuzz run "$target" -O --target x86_64-unknown-linux-gnu -- -max_total_time=30
          done

  mutants:
    name: Mutants (changed code)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      # Warnings must not turn mutants into build failures.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: Diff against the base branch
        run: git diff "origin/${{ github.base_ref }}...HEAD" > pr.diff
      # Every mutant of the changed code must be caught by a test. Proven
      # equivalent mutants are excluded in .cargo/mutants.toml.
      - name: Mutants in the changed code
        run: cargo mutants --no-shuffle --in-diff pr.diff -- --lib --tests

  security:
    name: Security (audit + deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - name: Generate lockfile
        run: cargo generate-lockfile
      - name: Audit
        run: cargo audit
      - name: Deny
        run: cargo deny check
